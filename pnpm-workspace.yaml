packages:
  - "apps/*"
  - "packages/*"

# Packages allowed to run install scripts (pnpm blocks them by default).
allowBuilds:
  unrs-resolver: true # native resolver behind eslint-import-resolver-typescript
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  argon2: true
  esbuild: true
  cypress: true
